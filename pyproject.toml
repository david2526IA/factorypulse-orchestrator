[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorypulse-orchestrator"
version = "0.1.0"
description = "One-command, pinned-version end-to-end FactoryPulse demonstration runner."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "David"}]
dependencies = [
  "factorypulse-ingestion @ git+https://github.com/david2526IA/factorypulse-ingestion.git@d151cc1",
  "factorypulse-lakehouse @ git+https://github.com/david2526IA/factorypulse-lakehouse.git@380f303",
  "factorypulse-intelligence @ git+https://github.com/david2526IA/factorypulse-intelligence.git@a9592c2",
  "factorypulse-api @ git+https://github.com/david2526IA/factorypulse-api.git@a8ea693"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
factorypulse-run = "factorypulse_orchestrator.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
