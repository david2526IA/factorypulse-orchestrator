name: End-to-end CI
on: [push, pull_request]
permissions: {contents: read}
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install ".[dev]"
      - run: pytest -q
      - run: factorypulse-run run --workspace artifacts/ci-demo --count 20 --fault-after 14
